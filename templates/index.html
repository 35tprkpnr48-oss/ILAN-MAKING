<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İlanMatik - Profesyonel Çoklu İlan ve Broşür Oluşturucu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; }
    .font-serif-italic { font-family: 'Playfair Display', serif; font-style: italic; }
    #brosur-alani { width: 500px; height: 700px; min-width: 500px; min-height: 700px; max-width: 500px; max-height: 700px; }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- SOL: FORM PANELİ -->
    <div class="lg:col-span-5 bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 space-y-5 max-h-[92vh] overflow-y-auto">
      <h1 class="text-xl font-bold text-amber-400 border-b border-slate-700 pb-3 flex items-center justify-between">
        <span>✨ İlan Detayları</span>
        <span class="text-xs font-normal text-slate-400">Modüler Tasarım</span>
      </h1>

      <!-- KATEGORİ SEÇİMİ -->
      <div class="space-y-1">
        <label class="block text-xs font-bold text-slate-400 uppercase">1. Kategori Seçin</label>
        <select id="cat-select" onchange="changeCategory(this.value)" class="w-full bg-slate-700 border border-amber-500 rounded-lg p-2.5 text-sm font-bold text-white focus:outline-none">
          <option value="emlak">🏠 Emlak (Konut / Daire / Arsa)</option>
          <option value="vasita">🚗 Vasıta (Otomobil / Araç)</option>
          <option value="elektronik">📱 Elektronik (Telefon / Laptop)</option>
          <option value="giyim">👕 Giyim & Moda & Aksesuar</option>
          <option value="hizmet">💼 Hizmet & İş & Tadilat</option>
          <option value="market">🛒 Market & Genel Mağaza</option>
        </select>
      </div>

      <!-- İŞLETME/MAĞAZA ADI VE İLAN TİPİ -->
      <div class="grid grid-cols-2 gap-3 border-t border-slate-700 pt-3">
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">İşletme / Mağaza Adı</label>
          <input type="text" id="inp-store-name" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-white" placeholder="Örn: Özcan Galeri / Öztürk Emlak">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-400 uppercase mb-1">İlan Tipi</label>
          <input type="text" id="inp-type" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-amber-400 font-bold" placeholder="Örn: SATILIK / KİRALIK / SIFIR">
        </div>
      </div>

      <!-- FOTOĞRAFLAR -->
      <div class="space-y-2 border-t border-slate-700 pt-3">
        <label class="block text-xs font-bold text-slate-400 uppercase">Görsel Yükle</label>
        <div>
          <span class="text-[11px] text-slate-300 block mb-1">Ana Görsel (Büyük)</span>
          <input type="file" id="img-main" accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-amber-500 file:text-slate-900 font-semibold">
        </div>
        <div>
          <span class="text-[11px] text-slate-300 block mb-1">Detay Görselleri (3 Adet - İsteğe Bağlı)</span>
          <div class="grid grid-cols-3 gap-2">
            <input type="file" id="img-sub1" accept="image/*" class="text-[10px] text-slate-400">
            <input type="file" id="img-sub2" accept="image/*" class="text-[10px] text-slate-400">
            <input type="file" id="img-sub3" accept="image/*" class="text-[10px] text-slate-400">
          </div>
        </div>
      </div>

      <!-- BAŞLIK & AÇIKLAMA -->
      <div class="space-y-2 border-t border-slate-700 pt-3">
        <div>
          <label class="block text-xs text-slate-300 mb-1">İlan Başlığı</label>
          <input type="text" id="inp-title" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-white" placeholder="Başlık girin">
        </div>
        <div>
          <label class="block text-xs text-slate-300 mb-1">Açıklama Metni</label>
          <textarea id="inp-desc" rows="2" class="w-full bg-slate-700 border border-slate-600 rounded-lg p-2 text-xs text-white" placeholder="Detaylı açıklama"></textarea>
        </div>
      </div>

      <!-- ÖZELLİK MADDELERİ VE DİNAMİK SORU ETİKETLERİ -->
      <div class="border-t border-slate-700 pt-3 space-y-2">
        <label class="block text-xs font-bold text-amber-400 uppercase">Özellikler & Soru Detayları</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <div>
            <label id="lbl-q1" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 1</label>
            <input type="text" id="inp-f1" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
          <div>
            <label id="lbl-q2" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 2</label>
            <input type="text" id="inp-f2" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
          <div>
            <label id="lbl-q3" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 3</label>
            <input type="text" id="inp-f3" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
          <div>
            <label id="lbl-q4" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 4</label>
            <input type="text" id="inp-f4" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
          <div>
            <label id="lbl-q5" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 5</label>
            <input type="text" id="inp-f5" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
          <div>
            <label id="lbl-q6" class="block text-[10px] text-slate-400 font-bold mb-0.5">Soru 6</label>
            <input type="text" id="inp-f6" class="w-full bg-slate-700 border border-slate-600 rounded p-1.5 text-white">
          </div>
        </div>
      </div>

      <!-- FİYAT, ADRES, İLETİŞİM -->
      <div class="border-t border-slate-700 pt-3 space-y-2">
        <label class="block text-xs font-bold text-slate-400 uppercase">Fiyat, Adres & İletişim</label>
        <div class="grid grid-cols-2 gap-2 text-xs">
          <input type="text" id="inp-price" placeholder="Fiyat" class="bg-slate-700 border border-slate-600 rounded p-2 text-amber-400 font-bold">
          <input type="text" id="inp-phone" placeholder="Telefon" class="bg-slate-700 border border-slate-600 rounded p-2 text-white">
          <input type="text" id="inp-address" placeholder="Açık Adres" class="col-span-2 bg-slate-700 border border-slate-600 rounded p-2 text-white">
        </div>
      </div>

      <button onclick="downloadPNG()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-black py-3 rounded-xl shadow-lg transition text-sm">
        📸 BROŞÜRÜ YÜKSEK KALİTE İNDİR (PNG)
      </button>
    </div>

    <!-- SAĞ: CANLI BROŞÜR ÖNİZLEMESİ (KİLİTLİ 500x700 BÖLGE) -->
    <div class="lg:col-span-7 flex flex-col items-center justify-center sticky top-4">
      <span class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">CANLI AFİŞ ÖNİZLEMESİ (500x700px)</span>
      
      <div id="brosur-alani" class="bg-[#1e293b] text-white overflow-hidden shadow-2xl flex flex-col justify-between relative rounded-sm">
        <!-- ŞABLON KAPLAYICI -->
        <div id="template-render" class="w-full h-full flex flex-col justify-between">
          <!-- JS ile doldurulacak -->
        </div>
      </div>
    </div>

  </div>

  <script>
    // KATEGORİLERE ÖZEL SORU ETİKETLERİ VE ÖRNEK CEVAPLAR
    const categoryDefaults = {
      emlak: {
        questions: ["Oda Sayısı", "Metrekare (m²)", "Konum / Mahalle", "Banyo Sayısı", "Ekstra Özellik", "Site / Durum"],
        store: "ÖZTÜRK GAYRİMENKUL",
        type: "SATILIK DAİRE",
        title: "LUXURY DAİRE",
        desc: "Şehrin prestijli lokasyonunda, ulaşımı kolay, modern mimariye sahip ve yüksek prim potansiyelli eşsiz fırsat!",
        f1: "5+1 Oda", f2: "300 m²", f3: "Merkezi Konum", f4: "4 Banyo", f5: "Otopark Var", f6: "Site İçi",
        price: "8.500.000 TL", phone: "0555 123 45 67", address: "Alsancak Mah. Atatürk Cad. No:12 Konak / İzmir"
      },
      vasita: {
        questions: ["Model Yılı", "Kilometre (KM)", "Vites Tipi", "Yakıt Türü", "Motor Hacmi", "Ekspertiz Durumu"],
        store: "ÖZCAN GALERİ OTO",
        type: "SATILIK ARAÇ",
        title: "HONDA JAZZ 1.4 RS",
        desc: "Ekspertiz garantili, ilk sahibinden, yetkili servis bakımlı, masrafsız temiz aile aracı.",
        f1: "2014 Model", f2: "120.000 KM", f3: "Otomatik", f4: "Benzin / LPG", f5: "1.4 VTEC Engine", f6: "Hatasız Boyasız",
        price: "680.000 TL", phone: "0532 987 65 43", address: "Oto Galericiler Sitesi B-Blok No:4 İzmir"
      },
      elektronik: {
        questions: ["Garanti Süresi", "Pil Sağlığı / Batarya", "Öne Çıkan Özellik", "Kutu / Ürün Durumu", "Fatura / Belge", "Stok Durumu"],
        store: "TEKNO DÜNYASI STORE",
        type: "SIFIR / GARANTİLİ",
        title: "SONY WH-1000XM5",
        desc: "Sektör lideri aktif gürültü engelleyici kablosuz kulaklık. Orijinal kutulu ve 2 yıl resmi garantili.",
        f1: "2 Yıl Garanti", f2: "30 Saat Pil", f3: "Kablosuz ANC", f4: "Sıfır Kutulu", f5: "Faturalı Ürün", f6: "Anında Teslim",
        price: "9.999 TL", phone: "0850 123 00 11", address: "Teknoloji Pasajı Kat:1 No:12 Çankaya / İzmir"
      },
      giyim: {
        questions: ["Beden / Ölçü", "Renk Seçeneği", "Kumaş / Malzeme", "Ürün Durumu", "Teslimat Tipi", "Müşteri Güvencesi"],
        store: "BOUTIQUE LUXE",
        type: "YENİ SEZON",
        title: "ZARA DERİ CEKET",
        desc: "%100 Hakiki deri, özel tasarım kesim, yeni sezon vitrin ürünü. Sınırlı sayıda stok!",
        f1: "M - L Beden", f2: "Siyah Renk", f3: "%100 Hakiki Deri", f4: "Sıfır Etiketli", f5: "Ücretsiz Kargo", f6: "Değişim Garanti",
        price: "2.490 TL", phone: "0544 555 66 77", address: "Abdi İpekçi Cad. Nişantaşı / İstanbul"
      },
      hizmet: {
        questions: ["Hizmet Kapsamı", "Keşif Durumu", "Garanti Süresi", "Teslimat / Bitiş Süresi", "Sözleşme Durumu", "Fiyat Politikası"],
        store: "YILMAZ TEKNİK YAPILAR",
        type: "PROFESYONEL HİZMET",
        title: "TADİLAT & DEKORASYON",
        desc: "Uzman kadromuzla ev ve ofislerinizde kaliteli, hızlı, garantili ve ekonomik mimari çözümler.",
        f1: "Anahtar Teslim", f2: "Ücretsiz Keşif", f3: "10 Yıl Garanti", f4: "Zamanında Teslim", f5: "Sözleşmeli İş", f6: "Uygun Fiyat",
        price: "UYGUN FİYAT", phone: "0505 111 22 33", address: "Tüm İzmir ve Çevre İlçelerinde Hizmetinizdeyiz"
      },
      market: {
        questions: ["1. İndirimli Ürün", "2. İndirimli Ürün", "3. İndirimli Ürün", "4. İndirimli Ürün", "5. İndirimli Ürün", "6. İndirimli Ürün"],
        store: "SÜPER ÖZCAN MARKET",
        type: "DEV İNDİRİM",
        title: "HAFTANIN FIRSATLARI",
        desc: "Seçili gıda ve temizlik ürünlerinde bu haftaya özel dev indirimleri kaçırmayın!",
        f1: "Ayçiçek Yağı 5L", f2: "Süzme Peynir 1KG", f3: "Toz Deterjan 10KG", f4: "Çay 1000GR", f5: "Zeytin 1KG", f6: "Bal 850GR",
        price: "ŞOK FİYATLAR", phone: "0232 444 00 99", address: "Merkez Mah. Çarşı Cad. No:15 Bornova / İzmir"
      }
    };

    let uploadedImages = { main: null, sub1: null, sub2: null, sub3: null };

    // KATEGORİ DEĞİŞTİRME MEKANİZMASI
    function changeCategory(cat) {
      const data = categoryDefaults[cat];

      // Form Etiketlerini (Soruları) ve Örnek Cevapları Güncelle
      for (let i = 1; i <= 6; i++) {
        const lbl = document.getElementById(`lbl-q${i}`);
        if (lbl) lbl.innerText = data.questions[i - 1];
      }

      document.getElementById('inp-store-name').value = data.store;
      document.getElementById('inp-type').value = data.type;
      document.getElementById('inp-title').value = data.title;
      document.getElementById('inp-desc').value = data.desc;
      document.getElementById('inp-f1').value = data.f1;
      document.getElementById('inp-f2').value = data.f2;
      document.getElementById('inp-f3').value = data.f3;
      document.getElementById('inp-f4').value = data.f4;
      document.getElementById('inp-f5').value = data.f5;
      document.getElementById('inp-f6').value = data.f6;
      document.getElementById('inp-price').value = data.price;
      document.getElementById('inp-phone').value = data.phone;
      document.getElementById('inp-address').value = data.address;

      renderTemplate(cat);
    }

    function renderTemplate(cat) {
      const render = document.getElementById('template-render');
      const data = categoryDefaults[cat];

      // Yalnızca yüklenmiş resim varsa gösterilir, varsayılan resim koyulmaz (boş/şeffaf kalır)
      const imgMain = uploadedImages.main ? `<img src="${uploadedImages.main}" class="w-full h-full object-cover">` : '';
      const img1 = uploadedImages.sub1 ? `<img src="${uploadedImages.sub1}" class="w-full h-full object-cover rounded-sm">` : '';
      const img2 = uploadedImages.sub2 ? `<img src="${uploadedImages.sub2}" class="w-full h-full object-cover rounded-sm">` : '';
      const img3 = uploadedImages.sub3 ? `<img src="${uploadedImages.sub3}" class="w-full h-full object-cover rounded-sm">` : '';

      if(cat === 'emlak') {
        render.innerHTML = `
          <div class="h-[300px] relative bg-slate-800/80 overflow-hidden" id="box-main">
            ${imgMain}
            <div class="absolute top-3 left-3 bg-amber-500 text-slate-900 px-3 py-1 text-xs font-black rounded uppercase" id="p-store">${data.store}</div>
            <div class="absolute bottom-3 left-3 bg-black/70 backdrop-blur-md border border-white/20 text-white px-4 py-2 rounded">
              <span class="text-xs font-bold text-amber-400 block" id="p-type">${data.type}</span>
              <span class="text-xl font-black uppercase leading-none" id="p-title">${data.title}</span>
            </div>
          </div>
          <div class="bg-[#2d3748] p-3 text-center border-y border-slate-700">
            <p class="text-[11px] italic text-slate-200 line-clamp-2" id="p-desc">${data.desc}</p>
          </div>
          <div class="grid grid-cols-12 h-[220px] bg-slate-900">
            <div class="col-span-5 p-3 flex flex-col justify-around text-[11px] bg-slate-800 border-r border-slate-700">
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[0]}</span><span class="font-bold text-amber-400" id="p-f1">${data.f1}</span></div>
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[1]}</span><span class="font-bold text-amber-400" id="p-f2">${data.f2}</span></div>
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[2]}</span><span class="font-bold" id="p-f3">${data.f3}</span></div>
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[3]}</span><span class="font-bold" id="p-f4">${data.f4}</span></div>
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[4]}</span><span class="font-bold" id="p-f5">${data.f5}</span></div>
              <div><span class="text-slate-400 block text-[9px] uppercase">${data.questions[5]}</span><span class="font-bold" id="p-f6">${data.f6}</span></div>
            </div>
            <div class="col-span-7 grid grid-cols-2 gap-1 p-1 bg-slate-900">
              <div class="col-span-2 h-[105px] bg-slate-800/40 rounded-sm" id="box-sub1">${img1}</div>
              <div class="h-[95px] bg-slate-800/40 rounded-sm" id="box-sub2">${img2}</div>
              <div class="h-[95px] bg-slate-800/40 rounded-sm" id="box-sub3">${img3}</div>
            </div>
          </div>
          <div class="bg-slate-900 p-4 border-t border-slate-700 flex justify-between items-center h-[90px]">
            <div>
              <span class="text-2xl font-black text-amber-400 block leading-none" id="p-price">${data.price}</span>
              <span class="text-[10px] text-slate-400 block mt-1 max-w-[260px] truncate" id="p-address">${data.address}</span>
            </div>
            <div class="text-right">
              <span class="text-[10px] font-bold text-slate-400 uppercase block">İletişim</span>
              <span class="text-sm font-black text-white block" id="p-phone">${data.phone}</span>
            </div>
          </div>
        `;
      } else if(cat === 'vasita') {
        render.innerHTML = `
          <div class="bg-slate-900 p-3 border-b border-slate-800 flex justify-between items-center">
            <span class="text-xs font-black text-amber-400 uppercase tracking-wider" id="p-store">${data.store}</span>
            <span class="bg-amber-500 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded uppercase" id="p-type">${data.type}</span>
          </div>
          <div class="grid grid-cols-4 gap-1 p-2 bg-slate-950">
            <div class="h-[55px] bg-slate-800/50 rounded overflow-hidden" id="box-sub1">${img1}</div>
            <div class="h-[55px] bg-slate-800/50 rounded overflow-hidden" id="box-sub2">${img2}</div>
            <div class="h-[55px] bg-slate-800/50 rounded overflow-hidden" id="box-sub3">${img3}</div>
            <div class="h-[55px] bg-slate-800 flex items-center justify-center text-[9px] font-bold text-amber-400 text-center rounded border border-amber-500/30">EXPERTİZ GARANTİLİ</div>
          </div>
          <div class="h-[280px] relative bg-slate-800/80 overflow-hidden" id="box-main">
            ${imgMain}
            <div class="absolute bottom-2 left-2 bg-black/80 px-3 py-1.5 rounded border border-slate-700">
              <span class="text-lg font-black text-white uppercase" id="p-title">${data.title}</span>
            </div>
          </div>
          <div class="p-3 bg-slate-900 grid grid-cols-3 gap-2 text-center text-xs border-y border-slate-800">
            <div class="bg-slate-800 p-1.5 rounded"><span class="text-[9px] text-slate-400 block uppercase">${data.questions[0]}</span><span class="font-bold text-amber-400" id="p-f1">${data.f1}</span></div>
            <div class="bg-slate-800 p-1.5 rounded"><span class="text-[9px] text-slate-400 block uppercase">${data.questions[1]}</span><span class="font-bold text-amber-400" id="p-f2">${data.f2}</span></div>
            <div class="bg-slate-800 p-1.5 rounded"><span class="text-[9px] text-slate-400 block uppercase">${data.questions[2]}</span><span class="font-bold" id="p-f3">${data.f3}</span></div>
          </div>
          <div class="p-3 bg-slate-900 flex justify-between items-center h-[120px]">
            <div>
              <span class="text-[10px] text-slate-400 block" id="p-desc">${data.desc}</span>
              <span class="text-2xl font-black text-amber-400 block mt-1" id="p-price">${data.price}</span>
            </div>
            <div class="text-right bg-slate-800 p-2.5 rounded border border-slate-700">
              <span class="text-[9px] text-slate-400 uppercase block">Hemen Arayın</span>
              <span class="text-sm font-black text-white block" id="p-phone">${data.phone}</span>
              <span class="text-[9px] text-slate-400 block truncate max-w-[130px] mt-1" id="p-address">${data.address}</span>
            </div>
          </div>
        `;
      } else if(cat === 'elektronik') {
        render.innerHTML = `
          <div class="p-4 bg-gradient-to-br from-indigo-900 to-slate-900 h-full flex flex-col justify-between">
            <div class="flex justify-between items-center">
              <span class="text-xs font-black text-cyan-400 tracking-wider" id="p-store">${data.store}</span>
              <span class="bg-cyan-400 text-slate-900 text-[10px] font-black px-2 py-0.5 rounded" id="p-type">${data.type}</span>
            </div>
            <div class="my-2">
              <h2 class="text-2xl font-black text-white uppercase leading-tight" id="p-title">${data.title}</h2>
              <p class="text-[11px] text-slate-300 line-clamp-2 mt-1" id="p-desc">${data.desc}</p>
            </div>
            <div class="grid grid-cols-12 gap-2 h-[280px]">
              <div class="col-span-8 h-full bg-slate-800/50 rounded-xl overflow-hidden border border-cyan-500/20 relative" id="box-main">
                ${imgMain}

    // ANLIK METİN GÜNCELLEME
    function updatePreviewAll() {
      const mappings = [
        ['inp-store-name', 'p-store'],
        ['inp-type', 'p-type'],
        ['inp-title', 'p-title'],
        ['inp-desc', 'p-desc'],
        ['inp-f1', 'p-f1'],
        ['inp-f2', 'p-f2'],
        ['inp-f3', 'p-f3'],
        ['inp-f4', 'p-f4'],
        ['inp-f5', 'p-f5'],
        ['inp-f6', 'p-f6'],
        ['inp-price', 'p-price'],
        ['inp-phone', 'p-phone'],
        ['inp-address', 'p-address']
      ];

      mappings.forEach(([inputId, previewId]) => {
        const inp = document.getElementById(inputId);
        const prev = document.getElementById(previewId);
        if (inp && prev) {
          prev.innerText = inp.value;
        }
      });
    }

    // FORM ELEMANLARINA DİNLEME EKLEME
    document.querySelectorAll('input, textarea').forEach(el => {
      el.addEventListener('input', updatePreviewAll);
    });

    // FOTOĞRAF YÜKLEME VE BAĞLANTI (SADECE YÜKLENEN RESMİ DOLDURUR)
    function bindImageUpload(inputId, targetKey, containerId) {
      document.getElementById(inputId)?.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => {
            uploadedImages[targetKey] = ev.target.result;
            const container = document.getElementById(containerId);
            if (container) {
              container.innerHTML = `<img src="${ev.target.result}" class="w-full h-full object-cover">`;
            }
          };
          reader.readAsDataURL(file);
        }
      });
    }

    bindImageUpload('img-main', 'main', 'box-main');
    bindImageUpload('img-sub1', 'sub1', 'box-sub1');
    bindImageUpload('img-sub2', 'sub2', 'box-sub2');
    bindImageUpload('img-sub3', 'sub3', 'box-sub3');

    // PNG OLARAK İNDİRME
    function downloadPNG() {
      const area = document.getElementById('brosur-alani');
      html2canvas(area, { scale: 3, useCORS: true }).then(canvas => {
        const a = document.createElement('a');
        a.download = `ilan-brosur-${Date.now()}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }

    // İLK YÜKLEMEDE EMLAK KATEGORİSİNİ BAŞLAT
    window.onload = () => changeCategory('emlak');
  </script>
