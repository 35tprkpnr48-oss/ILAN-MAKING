<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BroşürMatik - İlan ve Broşür Oluşturucu</title>
  <!-- Tailwind CSS: Tasarım için -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- html2canvas: Broşürü resim olarak kaydetmek için -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    /* Broşürün sabit boyutu (Kare format) */
    #brosur-alani { width: 480px; height: 480px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-8 text-slate-800">

  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-8">
    
    <!-- SOL: FORM PANELİ (Veri Girişi) -->
    <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200">
      <h1 class="text-2xl font-bold text-blue-600 mb-6 flex items-center gap-2">
        <span>📄</span> BroşürMatik
      </h1>

      <!-- ADIM 1: ŞABLON SEÇİMİ (Hazır Kalıplar) -->
      <div id="step-1" class="space-y-4">
        <h2 class="text-lg font-semibold text-slate-700">1. İlan Türünü Seçin</h2>
        <div class="grid grid-cols-2 gap-4">
          <button onclick="selectCategory('ev')" class="p-4 border-2 border-slate-200 hover:border-blue-500 rounded-lg flex flex-col items-center gap-2 transition hover:bg-blue-50">
            <span class="text-3xl">🏠</span>
            <span class="font-medium">Konut / Ev İlanı</span>
          </button>
          <button onclick="selectCategory('arsa')" class="p-4 border-2 border-slate-200 hover:border-blue-500 rounded-lg flex flex-col items-center gap-2 transition hover:bg-blue-50">
            <span class="text-3xl">🏞️</span>
            <span class="font-medium">Arsa İlanı</span>
          </button>
          <button onclick="selectCategory('araba')" class="p-4 border-2 border-slate-200 hover:border-blue-500 rounded-lg flex flex-col items-center gap-2 transition hover:bg-blue-50">
            <span class="text-3xl">🚗</span>
            <span class="font-medium">Vasıta / Araba</span>
          </button>
          <button onclick="selectCategory('genel')" class="p-4 border-2 border-slate-200 hover:border-blue-500 rounded-lg flex flex-col items-center gap-2 transition hover:bg-blue-50">
            <span class="text-3xl">🏷️</span>
            <span class="font-medium">Genel Ürün</span>
          </button>
        </div>
      </div>

      <!-- ADIM 2: DİNAMİK BİLGİ GİRİŞİ (Seçime göre değişir) -->
      <div id="step-2" class="hidden space-y-4">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-semibold text-slate-700">İlan Detayları</h2>
          <button onclick="goBack()" class="text-xs text-blue-600 hover:underline">← Kategori Değiştir</button>
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">Ürün / İlan Fotoğrafı Yükle</label>
          <input type="file" id="inp-image" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>

        <div>
          <label class="block text-sm font-medium mb-1">İlan Başlığı</label>
          <input type="text" id="inp-title" placeholder="Örn: Deniz Manzaralı 3+1 Daire" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Dinamik alanlar (Oda sayısı, KM vb.) buraya gelecek -->
        <div id="dynamic-fields" class="space-y-4"></div>

        <div>
          <label class="block text-sm font-medium mb-1">Fiyat</label>
          <input type="text" id="inp-price" placeholder="Örn: 4.250.000 TL" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-sm font-medium mb-1">İletişim Adı</label>
            <input type="text" id="inp-contact-name" placeholder="Örn: Ahmet Bey" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Telefon</label>
            <input type="text" id="inp-phone" placeholder="Örn: 0555 123 4567" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <button onclick="downloadBrochure()" class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-3 rounded-lg transition shadow-md flex items-center justify-center gap-2">
          <span>📥</span> Broşürü İndir (PNG)
        </button>
      </div>

    </div>

    <!-- SAĞ: CANLI ÖNİZLEME (İndirilecek Alan) -->
    <div class="flex flex-col items-center justify-start">
      <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">Canlı Önizleme</h2>
      
      <div id="brosur-alani" class="bg-white rounded-xl shadow-2xl overflow-hidden relative flex flex-col justify-between border">
        
        <!-- Üst Görsel Alanı -->
        <div class="relative w-full h-3/5 bg-slate-200 overflow-hidden flex items-center justify-center">
          <img id="preview-img" src="https://via.placeholder.com/600x400?text=Görsel+Yükleyin" class="w-full h-full object-cover">
          <span id="preview-badge" class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-bold px-3 py-1.5 rounded-full uppercase tracking-wider shadow">
            SATILIK
          </span>
        </div>

        <!-- Alt Bilgi Alanı -->
        <div class="p-5 flex-1 flex flex-col justify-between bg-white">
          <div>
            <h3 id="preview-title" class="text-xl font-bold text-slate-800 leading-snug line-clamp-1">
              İlan Başlığı
            </h3>
            <!-- Özellik Etiketleri (JS ile doldurulur) -->
            <div id="preview-tags" class="flex flex-wrap gap-2 mt-3"></div>
          </div>

          <!-- Alt Kısım: İletişim ve Fiyat -->
          <div class="flex justify-between items-end border-t pt-3 mt-2">
            <div>
              <p class="text-[10px] text-slate-400 font-bold uppercase">İletişim</p>
              <p id="preview-contact" class="text-xs font-semibold text-slate-700">Ad / Telefon</p>
            </div>
            <div class="text-right">
              <p class="text-[10px] text-slate-400 font-bold uppercase">Fiyat</p>
              <p id="preview-price" class="text-xl font-extrabold text-blue-600">0 TL</p>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Kategori Seçimi ve Dinamik Form Oluşturma
    function selectCategory(cat) {
      document.getElementById('step-1').classList.add('hidden');
      document.getElementById('step-2').classList.remove('hidden');

      const dynamicArea = document.getElementById('dynamic-fields');
      const badge = document.getElementById('preview-badge');
      dynamicArea.innerHTML = ''; // Temizle

      if (cat === 'ev') {
        badge.innerText = 'SATILIK EV';
        dynamicArea.innerHTML = `
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="f1" placeholder="Oda (3+1)" class="dyn-input p-2 border rounded-md text-sm">
            <input type="text" id="f2" placeholder="m² (120 m²)" class="dyn-input p-2 border rounded-md text-sm">
            <input type="text" id="f3" placeholder="Kat (3. Kat)" class="dyn-input p-2 border rounded-md text-sm">
          </div>`;
      } else if (cat === 'arsa') {
        badge.innerText = 'SATILIK ARSA';
        dynamicArea.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            <input type="text" id="f1" placeholder="m² (500 m²)" class="dyn-input p-2 border rounded-md text-sm">
            <input type="text" id="f2" placeholder="İmar (Konut)" class="dyn-input p-2 border rounded-md text-sm">
          </div>`;
      } else if (cat === 'araba') {
        badge.innerText = 'SATILIK ARAÇ';
        dynamicArea.innerHTML = `
          <div class="grid grid-cols-3 gap-2">
            <input type="text" id="f1" placeholder="Yıl (2020)" class="dyn-input p-2 border rounded-md text-sm">
            <input type="text" id="f2" placeholder="KM (90.000)" class="dyn-input p-2 border rounded-md text-sm">
            <input type="text" id="f3" placeholder="Vites (Oto)" class="dyn-input p-2 border rounded-md text-sm">
          </div>`;
      } else {
        badge.innerText = 'SATILIK';
        dynamicArea.innerHTML = `<input type="text" id="f1" placeholder="Durumu (Sıfır/Temiz)" class="dyn-input p-2 border rounded-md text-sm">`;
      }
      // Input dinleyicilerini tekrar bağla
      bindEvents();
    }

    // Geri Dön butonu
    function goBack() {
      document.getElementById('step-2').classList.add('hidden');
      document.getElementById('step-1').classList.remove('hidden');
    }

    // Input Değişikliklerini Dinleme
    function bindEvents() {
      document.querySelectorAll('input').forEach(i => i.addEventListener('input', updatePreview));
    }

    // Fotoğraf Yükleme ve Önizleme
    document.getElementById('inp-image').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById('preview-img').src = e.target.result;
        reader.readAsDataURL(file);
      }
    });

    // Canlı Önizlemeyi Güncelleme
    function updatePreview() {
      document.getElementById('preview-title').innerText = document.getElementById('inp-title').value || 'İlan Başlığı Buraya Gelecek';
      document.getElementById('preview-price').innerText = (document.getElementById('inp-price').value || '0') + ' TL';
      document.getElementById('preview-contact').innerText = `${document.getElementById('inp-contact-name').value || 'Ad'} - ${document.getElementById('inp-phone').value || 'Telefon'}`;

      // Dinamik etiketleri güncelle
      const tags = document.getElementById('preview-tags');
      tags.innerHTML = '';
      document.querySelectorAll('.dyn-input').forEach(i => {
        if (i.value) {
          tags.innerHTML += `<span class="bg-blue-50 text-blue-700 text-xs px-2.5 py-1 rounded-md font-medium border border-blue-100">${i.value}</span>`;
        }
      });
    }

    // html2canvas ile Broşürü PNG Olarak İndirme
    function downloadBrochure() {
      html2canvas(document.getElementById('brosur-alani'), { scale: 2 }).then(canvas => {
        const a = document.createElement('a');
        a.download = 'brosurmatik-${Date.now()}.png';
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    }
  </script>
</body>
</html>
