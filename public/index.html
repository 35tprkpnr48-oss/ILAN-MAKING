<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="İlanMatik: emlak, vasıta, elektronik, giyim, hizmet ve market ilanları için afiş hazırlama aracı.">
<title>İlanMatik – İlan afişi hazırla</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Oswald:wght@500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ec;--card:#fffdf9;--tx:#1b1a17;--mu:#6f6a61;--bd:#e3ddd2;--in:#faf7f2;--ac:#c2410c;--pri:#1b1a17;--prit:#fffdf9;--ok:#2f7d4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1d1b18;--tx:#f2eee7;--mu:#a39c90;--bd:#33302a;--in:#171512;--pri:#f2eee7;--prit:#1b1a17;--ac:#f08a5d}}
:root[data-theme="dark"]{--bg:#141311;--card:#1d1b18;--tx:#f2eee7;--mu:#a39c90;--bd:#33302a;--in:#171512;--pri:#f2eee7;--prit:#1b1a17;--ac:#f08a5d}
*{box-sizing:inherit}[hidden]{display:none!important}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:150px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{flex-wrap:wrap;max-width:1120px;margin:auto;padding:16px 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{display:flex;align-items:center;gap:11px}.mk{width:22px;height:22px;background:var(--pri);border-radius:5px;position:relative}.mk::after{content:"";position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;background:var(--ac);border-radius:2px}
.logo b{font-size:19px;font-weight:800;letter-spacing:-.03em}
.hb{display:flex;gap:6px}.ghost{white-space:nowrap;padding:9px 12px;min-height:40px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:600 13px "Inter",sans-serif;cursor:pointer}
.tabs{display:flex;gap:0;margin:8px 16px;max-width:1088px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--card)}
@media(min-width:1152px){.tabs{margin:8px auto}}
.tabs button{flex:1;min-height:44px;border:0;background:none;color:var(--tx);font:600 14px "Inter",sans-serif;cursor:pointer}
body[data-tab=edit] .tabs [data-t=edit],body[data-tab=prev] .tabs [data-t=prev]{background:var(--pri);color:var(--prit)}
main{max-width:1120px;margin:auto;padding:0 16px;display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h2{font-size:11px;margin:0 0 12px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;font-weight:700}
.meter .mh{display:flex;align-items:baseline;gap:10px}.meter b{font-size:20px;font-weight:800;letter-spacing:-.02em}.meter span{color:var(--mu);font-size:13px}
.mb{height:4px;background:var(--bd);border-radius:4px;margin-top:10px;overflow:hidden}.mb i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
label.f{display:block;margin-bottom:12px;font-size:12px;color:var(--mu);font-weight:600}
input[type=text],input[type=tel],input[type=password],select,textarea{display:block;width:100%;margin-top:5px;padding:11px 12px;min-height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--in);color:var(--tx);font:500 16px "Inter",system-ui,sans-serif}
textarea{resize:vertical;min-height:84px}
input[type=color]{display:block;margin-top:5px;width:100%;height:44px;border:1px solid var(--bd);border-radius:8px;background:var(--in);padding:3px;cursor:pointer}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:64px;padding:8px 4px;border:1.5px solid var(--bd);background:var(--in);color:var(--tx);border-radius:10px;font:600 13px "Inter",sans-serif;cursor:pointer}
.cats button.on,.tpls button.on{border-color:var(--pri);background:var(--pri);color:var(--prit)}
