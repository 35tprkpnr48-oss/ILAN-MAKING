 <div class="ctl card" style="margin-top:14px"><div class="row3">

let tt=0;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2800)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

 const sx=Math.min(Math.max(a.fx*im.width-sw/2,0),im.width-sw),sy=Math.min(Math.max(a.fy*im.height-sh/2,0),im.height-sh);

function analyze(cc){const n=24,t=document.createElement("canvas");t.width=t.height=n;const x=t.getContext("2d");x.drawImage(cc,0,0,n,n);const d=x.getImageData(0,0,n,n).data;
 const L=i=>.299*d[i]+.587*d[i+1]+.114*d[i+2];let sx=0,sy=0,sw=0,hx=0,hy=0,hw=0,bl=0,bn=0;

    ls(c,"1px");c.font=`600 9px ${SANS}`;c.fillStyle=col(dk?.72:.38);c.fillText(fit(c,up(f[0]),mw),x,ry+9);ls(c,"0px");
    let q=15;c.font=`600 ${q}px ${SANS}`;while(q>10&&c.measureText(f[1]).width>mw){q--;c.font=`600 ${q}px ${SANS}`}
    c.fillStyle=tx;c.fillText(fit(c,f[1],mw),x,ry+23)})}}
 // iletişim
 if(fh){const fy=ed?H-18-fh:H-fh;c.fillStyle=af;if(ed){rr(c,X,fy,IW,fh,lux?6:14);c.fill()}else c.fillRect(0,fy,W,fh);
  c.fillStyle=ftx;const fx=ed?X+18:X;let q=fy+(fh-fc)/2;
  if(tel){c.globalAlpha=.75;ls(c,"1.5px");c.font=`600 9px ${SANS}`;c.fillText("BİZİ ARAYIN",fx,q);ls(c,"0px");c.globalAlpha=1;c.font=`700 24px ${SANS}`;c.fillText(fit(c,tel,IW-(ed?36:0)),fx,q+13);q+=44+(aL.length?6:0)}
  c.font=`500 12px ${SANS}`;c.globalAlpha=.92;aL.forEach(l=>{c.fillText(l,fx,q);q+=16});c.globalAlpha=1}
 c.restore();c.restore()}

/* ---------- önizleme, kalite ölçer, taslak ---------- */
const cv=$("cv");let raf=0;
function meter(){const f=S.f.filter(v=>v.trim()).length,m=imgs.main||imgs.d0||imgs.d1||imgs.d2;
 const it=[[m,22,"Kapak fotoğrafı ekleyin"],[S.title.trim(),15,"Çarpıcı bir başlık yazın"],[S.price.trim(),15,"Fiyatı ekleyin"],[S.tel.trim(),15,"Telefon numarası ekleyin"],[S.desc.trim(),10,"Kısa bir açıklama ekleyin"],[f>=3,12,"En az 3 özelliği doldurun"],[S.addr.trim(),6,"Adres ekleyin"],[S.biz.trim(),5,"İşletme adını ekleyin"]];
 let p=0,t="";it.forEach(([v,w,s])=>{if(v)p+=w;else if(!t)t=s});$("pct").textContent=p+"%";$("mbar").style.width=p+"%";$("tip").textContent=t||"Harika, ilanınız hazır ✓"}
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{draw(cv.getContext("2d"),2,true)}catch(e){console.error(e)}meter()})}
let sv=0;function save(){clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({cur,S}))}catch(e){}},400)}
async function ready(){try{await Promise.race([Promise.all(FONTS.map(f=>document.fonts.load(f,"ĞÜŞİÖÇğüşıöç"))),new Promise(r=>setTimeout(r,2500))])}catch(e){}}

/* ---------- form ---------- */
function setCat(i,reset){cur=i;const C=CATS[i];
 [...$("cats").children].forEach((b,j)=>b.classList.toggle("on",j===i));
 $("type").innerHTML='<option value="">— (gösterme)</option>'+C.t.map(t=>`<option>${t}</option>`).join("");
 [...$("feats").children].forEach((l,j)=>l.firstChild.textContent=C.l[j]);
 if(reset){D={};S.tpl="cat";$("aiu").hidden=true;S.f=["","","","","",""];S.type=C.t[0];S.color=""}
 sync();sched();save()}
function sync(){document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;e.value=k==="color"?(S.color||CATS[cur].c):(S[k]||"")});
 document.querySelectorAll("[data-f]").forEach(e=>e.value=S.f[+e.dataset.f]||"");[...$("tpls").children].forEach((b,j)=>{b.classList.toggle("on",TPL[j][0]===S.tpl);b.textContent=j?TPL[j][1]:CATS[cur].tn});document.querySelector("[data-k=tone]").parentElement.hidden=S.tpl==="cat"}
CATS.forEach((c,i)=>{const b=document.createElement("button");b.type="button";b.textContent=c.n;b.onclick=()=>setCat(i,true);$("cats").appendChild(b)});
TPL.forEach(([k,n])=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.onclick=()=>{S.tpl=k;D.accent="";sync();sched();save()};$("tpls").appendChild(b)});
for(let i=0;i<6;i++){const l=document.createElement("label");l.className="f";l.innerHTML=`<span></span><input type="text" data-f="${i}" maxlength="28">`;$("feats").appendChild(l)}
function onIn(e){const t=e.target;if(t.dataset.k){S[t.dataset.k]=t.value;if(t.dataset.k==="title")D.title="";if(t.dataset.k==="desc")D.desc=""}else if(t.dataset.f)S.f[+t.dataset.f]=t.value;else return;sched();save()}
document.addEventListener("input",onIn);document.addEventListener("change",onIn);

/* ---------- görsel yükleme: createImageBitmap → FileReader yedeği, otomatik küçültme ---------- */
async function toCanvas(file){let src=null;
 if(window.createImageBitmap){try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){try{src=await createImageBitmap(file)}catch(_){}}}
 if(!src)src=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("read"));r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=r.result};r.readAsDataURL(file)});
 const w0=src.naturalWidth||src.width,h0=src.naturalHeight||src.height,r=Math.min(1,1600/Math.max(w0,h0)),cc=document.createElement("canvas");
 cc.width=Math.max(1,Math.round(w0*r));cc.height=Math.max(1,Math.round(h0*r));cc.getContext("2d").drawImage(src,0,0,cc.width,cc.height);if(src.close)src.close();return cc}
async function load(file,k){
 try{if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i.test(file.name))throw 1;
  const cc=await toCanvas(file);cc.an=analyze(cc);imgs[k]=cc;
  const u=SU[k],t=document.createElement("canvas");t.width=t.height=88;cover(t.getContext("2d"),cc,0,0,88,88,0);
  u.th.style.backgroundImage=`url(${t.toDataURL("image/jpeg",.7)})`;u.nm.textContent=file.name;u.lab.classList.add("ok");u.x.hidden=false;sched()}
 catch(e){toast(e===1?"Lütfen bir görsel dosyası seçin.":"Görsel açılamadı. JPG veya PNG deneyin (HEIC desteklenmeyebilir).")}}
function clr(k){delete imgs[k];const u=SU[k];u.nm.textContent=u.n;u.lab.classList.remove("ok");u.th.style.backgroundImage="";u.x.hidden=true;sched()}
const nextSlot=()=>(SL.find(([k])=>!imgs[k])||SL[0])[0];
SL.forEach(([k,n])=>{const d=document.createElement("div");d.className="slot";
 d.innerHTML=`<label class="drop"><span class="th"></span><span class="nm">${n}</span><input type="file" accept="image/*" aria-label="${n}"></label><button type="button" hidden aria-label="${n} kaldır">×</button>`;
 const lab=d.firstChild,inp=lab.lastChild;SU[k]={lab,n,th:lab.firstChild,nm:lab.children[1],x:d.lastChild};
 inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)load(f,k).then(()=>{inp.value=""})};
 SU[k].x.onclick=()=>clr(k);
 ["dragover","dragenter"].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.add("ov")}));
 ["dragleave","drop"].forEach(ev=>lab.addEventListener(ev,()=>lab.classList.remove("ov")));
 lab.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f,k)});
 $("slots").appendChild(d)});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f,nextSlot())});
window.addEventListener("paste",e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])].find(x=>/^image\//.test(x.type));if(f)load(f,nextSlot())});

/* ---------- sekmeler, örnek, temizle ---------- */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.body.dataset.tab=b.dataset.t;window.scrollTo(0,0);sched()});
$("demo").onclick=()=>{const x=CATS[cur].x;Object.assign(S,{biz:x.b,title:x.t,desc:x.d,price:x.p,tel:x.n,addr:x.a,f:[...x.f],type:CATS[cur].t[0]});D={};sync();sched();save();toast("Örnek içerik eklendi")};
let cf=0;$("clr").onclick=()=>{const b=$("clr");if(!cf){cf=1;b.textContent="Emin misiniz?";setTimeout(()=>{cf=0;b.textContent="Temizle"},3000);return}
 cf=0;b.textContent="Temizle";Object.keys(imgs).forEach(clr);Object.assign(S,{biz:"",title:"",desc:"",price:"",tel:"",addr:""});setCat(cur,true)};

/* ---------- dışa aktarma ---------- */
function render(t){const o=document.createElement("canvas");o.width=W*3;o.height=H*3;draw(o.getContext("2d"),3,false);
 return new Promise((res,rej)=>o.toBlob(b=>b?res([b,o]):rej(new Error("blob")),t,.93))}
$("fmt").onchange=()=>{H=+$("fmt").value;cv.height=H*2;cv.style.aspectRatio=W+"/"+H;sched()};
$("dl").onclick=async()=>{const btn=$("dl");btn.disabled=true;
 try{await ready();const jp=$("ext").value==="jpg",ty=jp?"image/jpeg":"image/png",[b]=await render(ty),name=slug(S.title||S.biz)+(H>800?"-story":"")+(jp?".jpg":".png");
  const url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);toast("İlan görseli indiriliyor. Galeriye eklemek için cihazınızın indirme/Fotoğraflar uygulamasını kontrol edin.")}
 catch(e){toast("İndirme başarısız. Tekrar deneyin.")}
 finally{btn.disabled=false}};


/* ---------- yapay zeka ile tasarım ---------- */
$("aiu").onclick=()=>{D={};$("aiu").hidden=true;sched()};
$("ai").onclick=async()=>{const b=$("ai"),old=b.textContent;b.disabled=true;b.textContent="Tasarlanıyor…";
 try{const sm=await claude.use("sample");if(!sm){toast("AI bu görünümde yok; otomatik yerleşim zaten çalışıyor.");return}
  const m=imgs.main||imgs.d0||imgs.d1||imgs.d2,info={kategori:CATS[cur].n.slice(3),isletme:S.biz,tip:S.type,baslik:S.title,aciklama:S.desc,fiyat:fmtPrice(),
   ozellikler:S.f.map((v,i)=>v.trim()?{i,etiket:CATS[cur].l[i],deger:v.trim()}:null).filter(Boolean),gorsel:m?{baskinTonDerece:Math.round(m.an.h),altBolgeKoyu:m.an.bot<.5}:null};
  const p=`Sen deneyimli bir ilan afişi tasarımcısısın. Aşağıdaki ilan verisini incele. YENİ BİLGİ UYDURMA, verilmeyen alanı boş bırak.
Sadece şu JSON'u döndür, başka metin yazma: {"title":"","desc":"","tone":"light|dark","accent":"#rrggbb","order":[0,1]}
- title: en fazla 60 karakter, doğal ve çarpıcı, abartılı klişe yok. Başlık boşsa "".
- desc: en fazla 240 karakter, akıcı Türkçe, yalnızca verilen bilgilerle. Açıklama boşsa "".
- tone: görsele ve kategoriye en uyumlu zemin.
- accent: kategori ve görselin baskın tonuyla uyumlu, beyaz yazı okunacak koyulukta bir renk.
- order: özellik indekslerini (i) en önemliden başlayarak sırala.
Veri: ${JSON.stringify(info)}`;
  const r=await sm(p,{modelTier:"quick",cache:false}),j=JSON.parse(r.text.match(/\{[\s\S]*\}/)[0]);
  D={title:S.title.trim()&&typeof j.title==="string"?j.title.slice(0,70):"",desc:S.desc.trim()&&typeof j.desc==="string"?j.desc.slice(0,280):"",
   tone:["light","dark"].includes(j.tone)?j.tone:"",accent:/^#[0-9a-f]{6}$/i.test(j.accent)?j.accent:"",order:Array.isArray(j.order)?j.order.filter(i=>Number.isInteger(i)&&i>=0&&i<6):null};
  $("aiu").hidden=false;sched();toast("AI düzeni uygulandı ✓")}
 catch(e){toast(e&&e.code==="rate_limited"?"Biraz bekleyip tekrar deneyin.":e&&e.code==="not_granted"?"AI izni verilmedi; otomatik yerleşim kullanılıyor.":"AI yanıt vermedi; otomatik yerleşim kullanılıyor.")}
 finally{b.disabled=false;b.textContent=old}};

/* ---------- paylaş (telefonda "Görüntüyü Kaydet"/WhatsApp) ve AI yalnızca destekleniyorsa görünür ---------- */
try{if(!(navigator.canShare&&navigator.canShare({files:[new File([""],"a.png",{type:"image/png"})]})))$("sh").hidden=true}catch(e){$("sh").hidden=true}
if(typeof claude==="undefined")$("ai").hidden=true;
$("sh").onclick=async()=>{const b=$("sh");b.disabled=true;
 try{await ready();const jp=$("ext").value==="jpg",ty=jp?"image/jpeg":"image/png",[bl]=await render(ty),f=new File([bl],slug(S.title||S.biz)+(jp?".jpg":".png"),{type:ty});await navigator.share({files:[f],title:S.title||"İlan"})}

try{const j=JSON.parse(localStorage.getItem(KEY)||"null");
 if(j&&j.S){cur=(j.cur>=0&&j.cur<CATS.length)?j.cur|0:0;Object.assign(S,j.S);if(!Array.isArray(S.f)||S.f.length!==6)S.f=["","","","","",""];if(!TPL.some(t=>t[0]===S.tpl))S.tpl="modern"}}catch(e){}
if(!S.biz&&!S.title&&!S.type)S.type=CATS[cur].t[0];
setCat(cur,false);ready().then(sched);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(sched);
