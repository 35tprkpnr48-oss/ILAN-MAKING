 <div class="ctl card" style="margin-top:14px"><div class="row3">

let tt=0;function toast(m){const e=$("toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),2800)}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* ---------- önizleme, kalite ölçer, taslak ---------- */
const cv=$("cv");let raf=0;
function meter(){const f=S.f.filter(v=>v.trim()).length,m=imgs.main||imgs.d0||imgs.d1||imgs.d2;
 const it=[[m,22,"Kapak fotoğrafı ekleyin"],[S.title.trim(),15,"Çarpıcı bir başlık yazın"],[S.price.trim(),15,"Fiyatı ekleyin"],[S.tel.trim(),15,"Telefon numarası ekleyin"],[S.desc.trim(),10,"Kısa bir açıklama ekleyin"],[f>=3,12,"En az 3 özelliği doldurun"],[S.addr.trim(),6,"Adres ekleyin"],[S.biz.trim(),5,"İşletme adını ekleyin"]];
 let p=0,t="";it.forEach(([v,w,s])=>{if(v)p+=w;else if(!t)t=s});$("pct").textContent=p+"%";$("mbar").style.width=p+"%";$("tip").textContent=t||"Harika, ilanınız hazır ✓"}
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{try{draw(cv.getContext("2d"),2,true)}catch(e){console.error(e)}meter()})}
let sv=0;function save(){clearTimeout(sv);sv=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify({cur,S}))}catch(e){}},400)}
async function ready(){try{await Promise.race([Promise.all(FONTS.map(f=>document.fonts.load(f,"ĞÜŞİÖÇğüşıöç"))),new Promise(r=>setTimeout(r,2500))])}catch(e){}}

/* ---------- form ---------- */
function setCat(i,reset){cur=i;const C=CATS[i];
 [...$("cats").children].forEach((b,j)=>b.classList.toggle("on",j===i));
 $("type").innerHTML='<option value="">— (gösterme)</option>'+C.t.map(t=>`<option>${t}</option>`).join("");
 [...$("feats").children].forEach((l,j)=>l.firstChild.textContent=C.l[j]);
 if(reset){D={};$("aiu").hidden=true;S.f=["","","","","",""];S.type=C.t[0];S.color=""}
 sync();sched();save()}
function sync(){document.querySelectorAll("[data-k]").forEach(e=>{const k=e.dataset.k;e.value=k==="color"?(S.color||CATS[cur].c):(S[k]||"")});
 document.querySelectorAll("[data-f]").forEach(e=>e.value=S.f[+e.dataset.f]||"");[...$("tpls").children].forEach((b,j)=>b.classList.toggle("on",TPL[j][0]===S.tpl))}

TPL.forEach(([k,n])=>{const b=document.createElement("button");b.type="button";b.textContent=n;b.onclick=()=>{S.tpl=k;D.accent="";sync();sched();save()};$("tpls").appendChild(b)});

function onIn(e){const t=e.target;if(t.dataset.k){S[t.dataset.k]=t.value;if(t.dataset.k==="title")D.title="";if(t.dataset.k==="desc")D.desc=""}else if(t.dataset.f)S.f[+t.dataset.f]=t.value;else return;sched();save()}
document.addEventListener("input",onIn);document.addEventListener("change",onIn);

/* ---------- görsel yükleme: createImageBitmap → FileReader yedeği, otomatik küçültme ---------- */
async function toCanvas(file){let src=null;
 if(window.createImageBitmap){try{src=await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){try{src=await createImageBitmap(file)}catch(_){}}}
 if(!src)src=await new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new Error("read"));r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("decode"));i.src=r.result};r.readAsDataURL(file)});
 const w0=src.naturalWidth||src.width,h0=src.naturalHeight||src.height,r=Math.min(1,1600/Math.max(w0,h0)),cc=document.createElement("canvas");
 cc.width=Math.max(1,Math.round(w0*r));cc.height=Math.max(1,Math.round(h0*r));cc.getContext("2d").drawImage(src,0,0,cc.width,cc.height);if(src.close)src.close();return cc}
async function load(file,k){
 try{if(!/^image\//.test(file.type)&&!/\.(jpe?g|png|webp|gif|avif|bmp|heic|heif)$/i.test(file.name))throw 1;
  const cc=await toCanvas(file);cc.an=analyze(cc);imgs[k]=cc;
  const u=SU[k],t=document.createElement("canvas");t.width=t.height=88;cover(t.getContext("2d"),cc,0,0,88,88,0);
  u.th.style.backgroundImage=`url(${t.toDataURL("image/jpeg",.7)})`;u.nm.textContent=file.name;u.lab.classList.add("ok");u.x.hidden=false;sched()}
 catch(e){toast(e===1?"Lütfen bir görsel dosyası seçin.":"Görsel açılamadı. JPG veya PNG deneyin (HEIC desteklenmeyebilir).")}}
function clr(k){delete imgs[k];const u=SU[k];u.nm.textContent=u.n;u.lab.classList.remove("ok");u.th.style.backgroundImage="";u.x.hidden=true;sched()}
const nextSlot=()=>(SL.find(([k])=>!imgs[k])||SL[0])[0];
SL.forEach(([k,n])=>{const d=document.createElement("div");d.className="slot";
 d.innerHTML=`<label class="drop"><span class="th"></span><span class="nm">${n}</span><input type="file" accept="image/*" aria-label="${n}"></label><button type="button" hidden aria-label="${n} kaldır">×</button>`;
 const lab=d.firstChild,inp=lab.lastChild;SU[k]={lab,n,th:lab.firstChild,nm:lab.children[1],x:d.lastChild};
 inp.onchange=()=>{const f=inp.files&&inp.files[0];if(f)load(f,k).then(()=>{inp.value=""})};
 SU[k].x.onclick=()=>clr(k);
 ["dragover","dragenter"].forEach(ev=>lab.addEventListener(ev,e=>{e.preventDefault();lab.classList.add("ov")}));
 ["dragleave","drop"].forEach(ev=>lab.addEventListener(ev,()=>lab.classList.remove("ov")));
 lab.addEventListener("drop",e=>{e.preventDefault();e.stopPropagation();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f,k)});
 $("slots").appendChild(d)});
window.addEventListener("dragover",e=>e.preventDefault());
window.addEventListener("drop",e=>{e.preventDefault();const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)load(f,nextSlot())});
window.addEventListener("paste",e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])].find(x=>/^image\//.test(x.type));if(f)load(f,nextSlot())});

- title: en fazla 60 karakter, doğal ve çarpıcı, abartılı klişe yok. Başlık boşsa "".
- desc: en fazla 240 karakter, akıcı Türkçe, yalnızca verilen bilgilerle. Açıklama boşsa "".
- tone: görsele ve kategoriye en uyumlu zemin.

Veri: ${JSON.stringify(info)}`;
  const r=await sm(p,{modelTier:"quick",cache:false}),j=JSON.parse(r.text.match(/\{[\s\S]*\}/)[0]);

try{const j=JSON.parse(localStorage.getItem(KEY)||"null");
